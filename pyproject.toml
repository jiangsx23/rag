[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-system"
version = "0.3.0"
description = "企业级 RAG + Agent 智能问答系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.39.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "langchain-qdrant>=0.2.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.2.0",
    "FlagEmbedding>=1.4.0",
    "pdfplumber>=0.11.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "ragas>=0.2.0",
    "langfuse>=2.53.0",
    "redis>=5.1.1",
    "hiredis>=3.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    "loguru>=0.7.2",
    "tenacity>=8.5.0",
]

# 只打包 app 和 core 两个包（仓库里还有 data/eval/scripts 等非包目录）
[tool.setuptools.packages.find]
include = ["app*", "core*"]

[tool.pytest.ini_options]
markers = [
    "integration: 需要真实外部服务的集成测试（DeepSeek / Qdrant / Redis）",
]

# 覆盖率测量排除 UI 外壳（Streamlit 页面，需浏览器环境，单元测试不覆盖）
[tool.coverage.run]
omit = ["app/ui.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
