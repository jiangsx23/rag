name: CI

# CI Pipeline: 在每次 push / PR 时自动跑测试、lint、覆盖率检查
# 这是"代码质量门禁"——不通过 CI 的代码不允许合并

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 取消正在运行的上一个 workflow（节省资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  POETRY_VERSION: "1.8.0"

jobs:
  # ============================================================
  # Job 1: 代码质量检查（最快，失败立即终止）
  # ============================================================
  lint:
    name: 🎨 Code Quality (Ruff + Black + Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.7.0 black==24.10.0 mypy==1.13.0

      - name: 🔍 Ruff (Lint)
        run: |
          echo "::group::Ruff 检查"
          ruff check . --output-format=github
          echo "::endgroup::"

      - name: 🎨 Black (Format Check)
        run: |
          echo "::group::Black 格式检查"
          black --check --diff .
          echo "::endgroup::"

      - name: 🔬 Mypy (Type Check)
        run: |
          echo "::group::Mypy 类型检查"
          # 允许 strict 模式下的少量 warning
          mypy core/ --ignore-missing-imports --no-strict-optional || true
          echo "::endgroup::"

  # ============================================================
  # Job 2: 单元测试
  # ============================================================
  test:
    name: 🧪 Unit Tests (pytest + coverage)
    runs-on: ubuntu-latest
    strategy:
      # 矩阵测试：在多个 Python 版本上跑
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest==8.3.0 pytest-cov==5.0.0 pytest-asyncio==0.24.0

      - name: 🧪 跑单元测试
        # 单元测试已通过 tests/conftest.py 把 LLM 全部替换为离线 mock，
        # 不再需要任何外部服务密钥，CI 可完全离线运行。
        run: |
          echo "::group::pytest 输出"
          pytest tests/ \
            --verbose \
            --tb=short \
            --cov=core \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=55 \
            --junitxml=test-results-${{ matrix.python-version }}.xml
          echo "::endgroup::"

      - name: 📊 上传覆盖率到 Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 📋 归档测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml

  # ============================================================
  # Job 3: 集成测试（需要真实服务，可选）
  # ============================================================
  integration:
    name: 🔗 Integration Tests (Real Services)
    runs-on: ubuntu-latest
    # 只在 main 分支跑，PR 不跑（避免消耗 API 额度）
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.0 pytest-asyncio==0.24.0

      - name: 🔗 跑集成测试
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_PROD }}
          QDRANT_URL: ${{ secrets.QDRANT_URL_PROD }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY_PROD }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY_PROD }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY_PROD }}
        run: |
          # 跑标记为 integration 的测试
          pytest tests/integration/ \
            --verbose \
            --tb=short \
            -m integration \
            --maxfail=3

  # ============================================================
  # Job 4: 安全扫描
  # ============================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔍 扫描密钥泄露
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: 🛡️ 依赖漏洞扫描
        run: |
          pip install safety==3.0.0
          safety check --json
        continue-on-error: true

  # ============================================================
  # Job 5: Build 验证（确保代码能打包）
  # ============================================================
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 安装 build 工具
        run: pip install build==1.2.0

      - name: 🏗️ 构建包
        run: |
          python -m build
          ls -la dist/

  # ============================================================
  # Job 6: 状态汇总
  # ============================================================
  ci-status:
    name: ✅ CI Status Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: 📊 检查所有 Job 状态
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All checks passed!"

      - name: 💬 通知 PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All CI checks passed! Ready to merge. 🎉'
            })
